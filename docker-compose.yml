name: telco-churn

# Pipeline order (enforced with depends_on conditions):
#   generator ──(completed)──┐
#   mlflow ─────(healthy)────┼──> trainer ──(completed)──> api
#   jupyter (independent)

services:
  # 1) One-shot job: generates data/telco_customers.csv
  generator:
    build:
      context: .
      dockerfile: Dockerfile
    image: telco-churn/generator:latest
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    command: python src/generate_dataset_ext.py --samples 20000 --conv-samples 3000
    restart: "no"

  # 2) MLflow tracking server + model registry (long-running)
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    image: telco-churn/mlflow:latest
    container_name: mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow-db:/mlflow/db
      - mlflow-artifacts:/mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # 3) One-shot job: trains the model, logs it to MLflow, writes models/churn_model.pkl
  trainer:
    build:
      context: .
      dockerfile: Dockerfile.train
    image: telco-churn/trainer:latest
    depends_on:
      generator:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    environment:
      - DATA_PATH=/app/data/telco_customers.csv
      - MODEL_PATH=/app/models/churn_model.pkl
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT=telco_churn_experiment
      - MLFLOW_REGISTER_MODEL=true
      - MLFLOW_REGISTERED_NAME=ChurnModel
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models
    restart: "no"

  # 4) FastAPI prediction service (long-running)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime
    image: telco-churn/api:latest
    container_name: churn-api
    depends_on:
      trainer:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/churn_model.pkl
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # 5) JupyterLab for exploration (optional, long-running)
  jupyter:
    image: quay.io/jupyter/scipy-notebook:latest
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./data:/home/jovyan/data:ro
      - ./config:/home/jovyan/config:ro
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=secret123
    restart: unless-stopped
    profiles: ["jupyter"]

volumes:
  mlflow-db:
  mlflow-artifacts:
